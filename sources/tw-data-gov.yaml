    tags: ["全字庫", "CNS11643", "中文編碼", "罕見字", "注音筆畫", "Unicode對照"]
    format: "CSV / ZIP"
    encoding: "BIG5"
    method: "GET"
    update_frequency: "不定期更新"
    download_url: "https://data.cns11643.gov.tw/opendata/Properties.zip"
    sample_url: "https://data.cns11643.gov.tw/opendata/OpenDataFilesList.csv"
    fields:
      - name: "名稱"
        type: "string"
        description: "全字庫開放檔案名稱（對應 OpenDataFilesList.csv 索引欄位）"
      - name: "所屬"
        type: "string"
        description: "所屬資料類別（字型、屬性資料或中文碼對照表）"
      - name: "類別"
        type: "string"
        description: "細部對照或字集分類"
      - name: "說明"
        type: "string"
        description: "對照表或屬性檔內容格式說明"
