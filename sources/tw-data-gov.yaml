  - id: "moda_cns11643_5961"
    name: "CNS11643 中文標準交換碼全字庫"
    category: "公共資訊"
    publisher: "數位發展部"
    source_page: "https://data.gov.tw/dataset/5961"
    ai_usage_guide: >
      處理臺灣戶政、地政、財稅罕見字、異體字與中文內碼轉換（Unicode、BIG5、電信碼、財稅內碼對照），
