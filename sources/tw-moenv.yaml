  - id: "uv_s_01"
    name: "紫外線即時監測資料"
    category: "大氣環境"
    publisher: "環境部環境資訊科技司"
    source_page: "https://data.moenv.gov.tw/dataset/detail/UV_S_01"
    ai_usage_guide: >
      當使用者詢問「現在紫外線強不強、UVI 指數多少、出門需不需要防曬」時查詢（整合環境部與中央氣象署紫外線測站每小時資料）。
      【重要格式陷阱】
      1. 測站儀器異常或夜間無有效值時，`Uvi` 可能回傳 `-999`，計算或呈現前必須過濾 `< 0` 之數值！
      2. 經緯度欄位 `WGS84_LON` / `WGS84_LAT` 在中央氣象署測站可能為度分秒逗號字串（如 `"121,30,53"`），而在環境部鹿林山站為十進位小數（如 `"120.85985238"`），空間繪圖前須統一轉換。
    tags: ["紫外線", "UVI", "防曬", "即時監測"]
    format: "JSON / CSV"
    encoding: "UTF-8"
    method: "GET"
    update_frequency: "每小時更新"
    endpoint: "/uv_s_01"
    sample_url: "https://data.moenv.gov.tw/api/v2/uv_s_01?limit=1&format=json"
    parameters:
      - name: "api_key"
        in: "query"
        type: "string"
        required: true
        description: "環境部開放平臺會員 API Key"
      - name: "language"
        in: "query"
        type: "string"
        required: false
        default: "zh"
        description: "語系篩選（zh 或 en）"
      - name: "format"
        in: "query"
        type: "string"
        required: false
        default: "json"
        description: "回傳格式"
      - name: "limit"
        in: "query"
        type: "integer"
        required: false
        default: 1000
        example: 50
        description: "回傳筆數上限"
      - name: "offset"
        in: "query"
        type: "integer"
        required: false
        default: 0
        description: "分頁位移"
    fields:
      - name: "SiteName"
        type: "string"
        description: "紫外線測站名稱（如：臺北、板橋、鹿林山、玉山）"
      - name: "Uvi"
        type: "float"
        unit: "UVI 指數"
        description: "紫外線指數（0-2 低量級、3-5 中量級、6-7 高量級、8-10 過量級、11+ 危險級；-999 代表無效值）"
      - name: "Unit"
        type: "string"
        description: "發布單位（如：中央氣象署、環境部）"
      - name: "County"
        type: "string"
        description: "縣市名稱"
      - name: "WGS84_LON"
        type: "string"
        description: "WGS84 經度（可能為度分秒逗號格式如 121,30,53 或十進位經度）"
      - name: "WGS84_LAT"
        type: "string"
        description: "WGS84 緯度（可能為度分秒逗號格式如 25,02,16 或十進位緯度）"
      - name: "DataCreationDate"
        type: "datetime"
        description: "資料發佈時間"

  - id: "cfp_p_02"
    name: "碳足跡排放係數"
    category: "氣候變遷因應"
    publisher: "環境部氣候變遷署"
