    sample_url: "https://data.moenv.gov.tw/api/v2/cfp_p_02?limit=1&format=json"
    parameters:
      - name: "api_key"
        in: "query"
        type: "string"
        required: true
        description: "環境部開放平臺會員 API Key"
      - name: "language"
        in: "query"
