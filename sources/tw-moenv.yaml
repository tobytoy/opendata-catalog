# ==========================================
# 2. 資料提供方共用資訊 (Provider Info)
# ==========================================
provider:
  id: "tw-moenv"
  name: "環境部環境資料開放平臺"
  summary: "涵蓋全臺即時空氣品質(AQI)、PM2.5、空品預報、紫外線、河川與水庫水質監測、碳足跡排放係數、環保列管事業及廢棄物統計 OpenAPI"
  organization: "中華民國環境部 (MOENV)"
  homepage: "https://data.moenv.gov.tw/"
  docs_url: "https://data.moenv.gov.tw/swagger"
  base_url: "https://data.moenv.gov.tw/api/v2"
  license: "政府資料開放授權條款-第1版"
  license_url: "https://data.gov.tw/license"
  rate_limit: "註冊會員並帶入 api_key 單一 API 每日上限 5,000 次；無金鑰訪客無法直接取得 /api/v2 回傳資料，大量資料建議搭配 limit 與 offset 分頁查詢"
  auth:
    required: true
    type: "API Key (Query Parameter)"
    param_name: "api_key"
    env_vars:
      - "MOENV_API_KEY"
    how_to_get: "至 https://data.moenv.gov.tw/api-term 同意 API 介接服務條款並完成會員註冊，即可取得專屬 API Key"
    notes: >
      【實測行為與已知限制】
      1. 實測未帶入或帶入無效 api_key 呼叫 /api/v2/* 時，伺服器會回傳 HTTP 200（Content-Type: text/plain），
         內文為純文字「api_key 不存在。」而非 HTTP 401，且不會先檢查資料集代碼是否存在；程式端解析 JSON 前務必檢查 Content-Type。
      2. 官方 OpenAPI 規格（https://data.moenv.gov.tw/swagger/openapi.yaml）於各端點宣告之通用查詢參數為
         language（zh/en，預設 zh）、offset（預設 0）、limit（預設 1000）與 api_key；各資料集頁面範例另提供 format=json 與 sort 參數。
      3. 【未帶金鑰實測聲明】因本目錄建立時未持有會員 api_key，尚未實測帶金鑰後之真實 JSON 外層結構與鍵名大小寫；
         以下 fields[].name 係依環境部各資料集頁面「主要資料欄位」之官方定義列載，實作取欄時建議採不分大小寫兼容處理。
      4. 請從環境變數 MOENV_API_KEY 讀取金鑰，嚴禁將金鑰寫死於程式碼或提交至版本控制。

# ==========================================
# 3. 資料集清單與詳細 Metadata (Datasets)
# ==========================================
datasets:
  - id: "aqx_p_432"
    name: "空氣品質指標(AQI)"
    category: "大氣環境"
    publisher: "環境部環境資訊科技司"
    source_page: "https://data.moenv.gov.tw/dataset/detail/AQX_P_432"
    ai_usage_guide: >
      當使用者詢問臺灣各縣市或測站「現在空氣品質好不好、AQI 數值、PM2.5 / PM10 / 臭氧濃度、是否適合戶外運動」時優先查詢。
      【資料清洗注意】
      1. 本資料集提供中英文語系資料（OpenAPI 參數 language 預設為 zh；部分匯出可能同時含中文「臺北市」與英文 "Taipei City" 列），
         統計全臺測站或縣市平均前建議指定 language=zh 並確認語系避免重複計算。
      2. 測站儀器維護或校正時，汙染物數值欄位可能為空字串 ""，轉數值前須做空值防呆；中文縣市名稱使用正體「臺」。
    tags: ["空氣品質", "AQI", "PM2.5", "PM10", "臭氧", "即時監測", "空污"]
    format: "JSON / CSV"
    encoding: "UTF-8"
    method: "GET"
    update_frequency: "每小時更新"
    endpoint: "/aqx_p_432"
    sample_url: "https://data.moenv.gov.tw/api/v2/aqx_p_432?limit=1&format=json"
    parameters:
      - name: "api_key"
        in: "query"
        type: "string"
        required: true
        description: "環境部開放平臺會員 API Key（請由環境變數 MOENV_API_KEY 帶入）"
      - name: "language"
        in: "query"
        type: "string"
        required: false
        default: "zh"
        example: "zh"
        description: "語系篩選（依官方 OpenAPI 規格：zh 或 en，預設 zh）"
      - name: "format"
        in: "query"
        type: "string"
        required: false
        default: "json"
        example: "json"
        description: "回傳格式（資料集頁面範例使用 json，亦支援 csv、xml）"
      - name: "limit"
        in: "query"
        type: "integer"
        required: false
        default: 1000
        example: 100
        description: "回傳筆數上限"
      - name: "offset"
        in: "query"
        type: "integer"
        required: false
        default: 0
        example: 0
        description: "略過前 N 筆資料（分頁用）"
      - name: "sort"
        in: "query"
        type: "string"
        required: false
        example: "ImportDate desc"
        description: "排序欄位與方向（資料集頁面範例為 ImportDate desc）"
    fields:
      - name: "SiteName"
        type: "string"
        description: "測站名稱（如：中山、板橋、前鎮）"
      - name: "County"
        type: "string"
        description: "縣市名稱（中文使用正體「臺」如臺北市、臺中市；英文如 Taipei City）"
      - name: "AQI"
        type: "integer"
        unit: "指標值"
        description: "空氣品質指標（0-50 良好、51-100 普通、101-150 對敏感族群不健康、151-200 對所有族群不健康）"
      - name: "Pollutant"
        type: "string"
        description: "空氣污染指標物（如 NO2、細懸浮微粒；良好時可能為空字串）"
      - name: "Status"
        type: "string"
        description: "空氣品質狀態（如：良好／Good、普通／Moderate）"
      - name: "PM2.5"
        type: "float"
        unit: "μg/m³"
        description: "細懸浮微粒小時濃度"
      - name: "PM2.5_AVG"
        type: "float"
        unit: "μg/m³"
        description: "細懸浮微粒移動平均值"
      - name: "PM10"
        type: "float"
        unit: "μg/m³"
        description: "懸浮微粒小時濃度"
      - name: "O3"
        type: "float"
        unit: "ppb"
        description: "臭氧小時濃度"
      - name: "O3_8hr"
        type: "float"
        unit: "ppb"
        description: "臭氧 8 小時移動平均濃度"
      - name: "publishtime"
        type: "datetime"
        format: "YYYY-MM-DD HH:mm"
        description: "資料發布時間"
      - name: "Longitude"
        type: "float"
        description: "測站經度（WGS84）"
      - name: "Latitude"
        type: "float"
        description: "測站緯度（WGS84）"
      - name: "SiteId"
        type: "string"
        description: "測站編號"

