        type: "string"
        description: "宣告單位（如：度(kwh)、公升(L)、公斤(kg)、平方公尺(m2)）"
      - name: "DepartmentName"
        type: "string"
        description: "政府部門/公司名稱（選擇性揭露）"
      - name: "AnnouncementYear"
        type: "string"
        format: "YYYY"
        description: "公告年份"
      - name: "Scpoe3_iso"
        type: "string"
        description: "範疇三盤查適用類別依循【ISO14064_1】（注意官方欄位拼字為 Scpoe3_iso）"
      - name: "Scpoe3_ghg"
        type: "string"
        description: "範疇三盤查適用類別【依循GHG Protocol】（注意官方欄位拼字為 Scpoe3_ghg）"

  - id: "wqx_p_01"
    name: "河川水質監測資料"
    category: "流域與水質"
    publisher: "環境部環境資訊科技司"
    source_page: "https://data.moenv.gov.tw/dataset/detail/WQX_P_01"
    ai_usage_guide: >
      查詢臺灣各主要河川與流域之每月採樣水質檢測結果，包含河川污染分類指標 (RPI)、溶氧 (DO)、生化需氧量 (BOD5)、化學需氧量 (COD)、氨氮、懸浮固體與重金屬。
      【結構注意】本表採用「長表（Long Format）」結構：同一個測站同一次採樣會拆成多列，每列代表一個測項（`ItemName` / `ItemEngAbbreviation`），
      且未檢出或未測項目之 `ItemValue` 可能為 `"-"` 或 `"<0.01"`；因需實驗室品保程序，通常隔月發布上月數據。
    tags: ["河川水質", "水污染", "RPI", "溶氧量", "流域監測"]
    format: "JSON / CSV"
    encoding: "UTF-8"
    method: "GET"
    update_frequency: "每月更新（隔月發布）"
    endpoint: "/wqx_p_01"
    sample_url: "https://data.moenv.gov.tw/api/v2/wqx_p_01?limit=1&format=json"
    parameters:
      - name: "api_key"
        in: "query"
        type: "string"
        required: true
        description: "環境部開放平臺會員 API Key"
      - name: "language"
        in: "query"
        type: "string"
        required: false
        default: "zh"
        description: "語系篩選（zh 或 en）"
      - name: "format"
        in: "query"
        type: "string"
        required: false
        default: "json"
