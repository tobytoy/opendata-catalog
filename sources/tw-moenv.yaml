        description: "回傳格式"
      - name: "limit"
        in: "query"
        type: "integer"
        required: false
        default: 1000
        example: 1000
        description: "回傳筆數上限（目前約 1,188 筆，可設 limit=1000 搭配 offset 分兩頁取完）"
      - name: "offset"
        in: "query"
        type: "integer"
        required: false
        default: 0
        description: "分頁起始位移"
    fields:
